<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UW Student Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>UW Student Portal</h1>
    <p class="subtitle">Training app. Fake data only. Do not enter real passwords.</p>

    <!-- Login Box -->
    <div id="loginBox" class="card">
      <h2>Sign in</h2>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" required>
        <button type="submit">Sign in</button>
      </form>
      <p id="loginMsg" class="error"></p>
      <p class="demo-hint">Demo accounts: ayesha@uw.test / ayesha123 (student)</p>
    </div>

    <!-- Student Dashboard -->
    <div id="dash" class="card hidden">
      <h2 id="welcome"></h2>
      <button id="signoutBtn">Sign out</button>

      <h3>My Results</h3>
      <form id="resultForm">
        <label for="resultId">Student ID</label>
        <input type="text" id="resultId">
        <button type="submit">View result</button>
      </form>
      <div id="resultOut"></div>

      <h3>Search courses</h3>
      <form id="searchForm">
        <input type="text" id="q" placeholder="e.g. CYS">
        <button type="submit">Search</button>
      </form>
      <div id="searchOut"></div>

      <div class="links">
        <a href="https://example.com/fee-policy" target="_blank" rel="noopener noreferrer">Fee policy (external)</a>
      </div>

      <!-- Admin Panel -->
      <div id="admin" class="card hidden">
        <h3>Admin panel</h3>
        <ul id="userList"></ul>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
